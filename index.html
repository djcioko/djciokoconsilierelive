<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DJCIOKO - STUDIO EMISIE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body style="background:#111; color:#fff; text-align:center; font-family:sans-serif; padding:20px;">
    <h2>STUDIO EMISIE LIVE</h2>
    <p id="status">Status: Oprit</p>
    <p>Ascultători online: <span id="counter">0</span></p>
    
    <video id="localVideo" autoplay playsinline muted style="width:300px; border-radius:10px; background:#000;"></video><br><br>
    <button id="btnStart" style="padding:12px 24px; font-size:16px; background:red; color:#fff; border:none; border-radius:8px; cursor:pointer;">PORNEȘTE ON AIR</button>

    <script>
        const STUDIO_ID = 'djcioko-live-studio-999';
        let peer = null;
        let localStream = null;
        let onlineCount = 0;

        document.getElementById('btnStart').addEventListener('click', async () => {
            try {
                // 1. Luăm camera și microfonul
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('status').textContent = 'Se pornește serverul...';

                // 2. Inițiem PeerJS cu ID-ul fix
                peer = new Peer(STUDIO_ID, {
                    host: '0.peerjs.com',
                    port: 443,
                    secure: true
                });

                peer.on('open', (id) => {
                    document.getElementById('status').textContent = '🟢 ON AIR (Emisie activă)';
                    document.getElementById('btnStart').style.display = 'none';
                });

                // 3. Când un ascultător se conectează (prin Weebly)
                peer.on('connection', (conn) => {
                    onlineCount++;
                    document.getElementById('counter').textContent = onlineCount;

                    conn.on('close', () => {
                        onlineCount = Math.max(0, onlineCount - 1);
                        document.getElementById('counter').textContent = onlineCount;
                    });
                });

                // 4. Când ascultătorul cere stream-ul video/audio (apelul)
                peer.on('call', (call) => {
                    // Îi trimitem direct stream-ul nostru video și audio
                    call.answer(localStream);
                });

                peer.on('error', (err) => {
                    console.error(err);
                    alert('Eroare PeerJS: ' + err.type);
                });

            } catch (e) {
                alert('Eroare la pornirea camerei: ' + e.message);
            }
        });
    </script>
</body>
</html>
